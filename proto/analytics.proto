syntax = "proto3";

package et.analytics.v1;

message EventBatch {
  string protocol_version = 1;
  string sent_at = 2;
  repeated Event events = 3;
}

message Event {
  string event_id = 1;
  string type = 2;
  string name = 3;
  string timestamp = 4;
  Identity identity = 5;
  bytes properties_json = 6;
  bytes context_json = 7;
  string schema_version = 8;
}

message Identity {
  string anonymous_id = 1;
  string session_id = 2;
  optional string user_id = 3;
}
