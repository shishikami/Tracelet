name: Feature request
description: 提议新的 SDK 能力、Adapter、文档或开发体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: 描述真实接入场景以及目前为什么难以完成。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: 如果涉及公开 API，请给出理想的调用示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: 是否可以通过 Plugin、Transport、Codec 或应用侧封装解决？
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and privacy impact
      description: 说明浏览器、包体积、Consent、数据收集和向后兼容性影响。
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: 我已搜索现有 Issue 和 Roadmap。
          required: true
