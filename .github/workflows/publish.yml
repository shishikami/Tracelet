name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage package on npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install release tooling
        run: npm install --global npm@11.21.0 pnpm@10.18.3

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module -e 'import pkg from "./package.json" with { type: "json" };
          const expected = "v" + pkg.version;
          if (process.env.RELEASE_TAG !== expected)
          throw new Error("Release tag " + process.env.RELEASE_TAG + " does not match package version " + expected);'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks, including installed-package smoke test
        run: pnpm check

      - name: Build framework and bundler consumers
        run: pnpm smoke:ecosystem

      - name: Verify npm package contents
        run: pnpm pack:check

      - name: Stage package for maintainer approval
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_SPEC=$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.name + "@" + pkg.version)')
          if npm view "$PACKAGE_SPEC" version --json >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already public; skipping the immutable publish step."
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            npm stage publish --tag beta
          else
            npm stage publish --tag latest
          fi
